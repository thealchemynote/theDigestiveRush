<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>theDigestiveRush FINAL 1.1</title>
<style>
:root{
  --bg:#061018;--panel:#101b27;--panel2:#16263a;--line:#2d435b;
  --text:#eef8ff;--muted:#8ea8bd;--cyan:#35d0ff;--mint:#9cffd2;
  --red:#ff4d6d;--gold:#ffe66d;--purple:#c79cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;overflow:hidden;text-align:center;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#1a3a55 0%,#071018 55%,#02060b 100%);
  touch-action:manipulation;
}
.screen{
  width:100%;max-width:430px;height:100svh;margin:0 auto;padding:10px;
  display:flex;flex-direction:column;gap:7px;position:relative;
}
.hidden{display:none!important}
.card{
  margin:auto 0;padding:22px 14px;border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(180deg,rgba(22,38,58,.96),rgba(7,14,23,.98));
  box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 0 24px rgba(53,208,255,.08);
}
h1{font-size:33px;margin:0 0 5px;letter-spacing:.4px}
h2{margin:8px 0}
.subtitle{color:var(--muted);font-size:13px;margin:4px 0 16px}
button{
  border:0;border-radius:999px;padding:12px 17px;margin:5px;font-weight:800;
  color:#031018;background:linear-gradient(135deg,var(--cyan),var(--mint));
  box-shadow:0 8px 22px rgba(53,208,255,.18);
}
button:active{transform:scale(.97)}
button.secondary{background:#223246;color:var(--text);border:1px solid var(--line)}
.toggle{
  margin:12px auto 4px;max-width:270px;padding:9px 12px;border:1px solid var(--line);
  border-radius:999px;background:#142235;color:var(--text);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.toggle.on{background:linear-gradient(135deg,#253b51,#173d4f);box-shadow:0 0 18px rgba(53,208,255,.12)}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.topbar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;font-size:11px}
.stat{background:rgba(16,27,39,.9);border:1px solid var(--line);border-radius:14px;padding:5px 2px}
.stat b{display:block;font-size:17px;color:var(--text)}
.section{
  background:rgba(16,27,39,.88);border:1px solid var(--line);border-radius:17px;padding:7px;
  box-shadow:inset 0 0 20px rgba(53,208,255,.035);
}
.label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.13em;margin:0 2px 5px}
.row{display:flex;gap:6px;justify-content:center;align-items:center}
.queue-slot,.organ,.action{
  user-select:none;border:1px solid var(--line);background:linear-gradient(180deg,#172638,#0c1723);
  border-radius:14px;color:var(--text);
}
.queue-slot{
  width:15.2%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:25px;
}
.queue-slot.empty{opacity:.35}
.organ-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.organ{min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.organ .food{font-size:25px;height:28px}
.organ .name{font-size:14px;color:var(--muted)}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.action{min-height:41px;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;font-size:11px;font-weight:700}
.action .icon{font-size:16px}
.action.shuffleTarget{border-color:#3f5e78}
.action.shuffling{animation:cardPulse .38s ease-in-out}
@keyframes cardPulse{0%{transform:scale(1);box-shadow:none}50%{transform:scale(1.05);box-shadow:0 0 18px rgba(255,230,109,.35)}100%{transform:scale(1);box-shadow:none}}
.selected{outline:2px solid var(--gold);box-shadow:0 0 18px rgba(255,230,109,.35)}
#msg{min-height:27px;color:var(--mint);font-size:13px;padding:3px}
.flash-good{animation:good .16s}.flash-bad{animation:bad .16s}.flash-absorb{animation:absorb .22s}.flash-warn{animation:warnFlash .22s}
@keyframes good{0%{box-shadow:0 0 0 999px rgba(53,208,255,.20)}100%{box-shadow:none}}
@keyframes bad{0%{box-shadow:0 0 0 999px rgba(255,77,109,.24)}100%{box-shadow:none}}
@keyframes absorb{0%{box-shadow:0 0 0 999px rgba(255,230,109,.30)}100%{box-shadow:none}}
@keyframes warnFlash{0%{box-shadow:0 0 0 999px rgba(255,179,71,.22)}100%{box-shadow:none}}
.bad-shake{animation:shake .18s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#comboPop,#eventPop{
  pointer-events:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  font-weight:900;letter-spacing:.04em;opacity:0;z-index:3;
}
#comboPop{font-size:34px;color:var(--gold);text-shadow:0 0 12px rgba(255,230,109,.65),0 0 28px rgba(53,208,255,.35)}
#eventPop{top:38%;font-size:25px;color:#ffb347;text-shadow:0 0 14px rgba(255,179,71,.75),0 0 28px rgba(255,77,109,.25)}
.combo-show{animation:comboPop .65s ease-out}
.event-show{animation:eventPop .9s ease-out}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-45%) scale(.75)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}
@keyframes eventPop{0%{opacity:0;transform:translate(-50%,-35%) scale(.8)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
.ranklist{line-height:1.75;color:var(--text)}
.footer-note{font-size:10px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>

<div id="title" class="screen">
  <div class="card" id="modeCard">
    <h1>theDigestiveRush</h1>
    <div class="subtitle">FINAL 1.1 / 消化・吸収スピードアクション</div>
    <div id="shuffleToggle" class="toggle" onclick="tapSelect();toggleShuffle()">酵素シャッフル：OFF</div>
    <button onclick="tapSelect();showDifficulty()">60秒モード</button>
    <button onclick="tapStart();startGame('endless')">フリーモード</button>
    <p class="small">60秒モードは難易度選択。<br>フリーモードは時間無制限でだんだん加速。</p>
    <div class="footer-note">正解：青　吸収：黄　ミス：赤</div>
  </div>

  <div class="card hidden" id="difficultyCard">
    <h2>60秒モード</h2>
    <div class="subtitle">難易度を選択</div>
    <button onclick="tapStart();startGame('60','easy')">Easy</button>
    <button onclick="tapStart();startGame('60','normal')">Normal</button>
    <button onclick="tapStart();startGame('60','hard')">Hard</button>
    <button onclick="tapStart();startGame('60','expert')">Expert</button>
    <br><button class="secondary" onclick="tapSelect();backTitle()">戻る</button>
    <p class="small" id="shuffleStatusText">酵素シャッフル：OFF</p>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="comboPop"></div>
  <div id="eventPop"></div>
  <div class="topbar">
    <div class="stat">LIFE<b id="life">3</b></div>
    <div class="stat">SCORE<b id="score">0</b></div>
    <div class="stat">COMBO<b id="combo">0</b></div>
    <div class="stat">TIME<b id="time">60</b></div>
  </div>

  <div class="section">
    <div class="label"><span>FOOD LINE</span><span id="modeInfo">MAX 6</span></div>
    <div id="queue" class="row"></div>
  </div>

  <div class="section">
    <div class="label"><span>DIGESTIVE ORGANS</span><span>移動・処理</span></div>
    <div class="organ-grid">
      <div class="organ" data-organ="mouth"><div class="food"></div><div class="name">口</div></div>
      <div class="organ" data-organ="stomach"><div class="food"></div><div class="name">胃</div></div>
      <div class="organ" data-organ="duo"><div class="food"></div><div class="name">十二指腸</div></div>
      <div class="organ" data-organ="small"><div class="food"></div><div class="name">小腸</div></div>
    </div>
  </div>

  <div class="section">
    <div class="label"><span>CARDS</span><span>酵素・吸収</span></div>
<div id="actionGrid" class="action-grid"></div>
  </div>

  <div id="msg">食べ物をタップ → 消化器官をタップ</div>
</div>

<div id="result" class="screen hidden">
  <div class="card">
    <h2>RESULT</h2>
    <div id="resultText"></div>
    <h3 id="rankingTitle">RANKING</h3>
    <div id="ranking" class="ranklist"></div>
    <button onclick="tapSelect();location.reload()">TITLE</button>
  </div>
</div>

<script>
let audioCtx=null;
let mode="60",difficulty="normal",timer=60,elapsed=0,score=0,life=3,combo=0,maxCombo=0;
let spawn=2500,spawnTimer=null,timeLoop=null,levelLoop=null,shuffleTimers=[];
let queue=[],organs={mouth:null,stomach:null,duo:null,small:null};
let selectedQueue=null,selectedOrgan=null,selectedAction=null;
let shuffleEnabled=false;

const foods={
  rice:{icon:"🍙",type:"carb",name:"おにぎり"},
  meat:{icon:"🥩",type:"protein",name:"肉"},
  fat:{icon:"🧈",type:"fat",name:"脂肪"}
};
const diff={
  easy:{label:"Easy",spawn:5500,shuffleAt:[38]},
  normal:{label:"Normal",spawn:4500,shuffleAt:[32]},
  hard:{label:"Hard",spawn:3000,shuffleAt:[24,44]},
  expert:{label:"Expert",spawn:1800,shuffleAt:[18,38]}
};
const enzymeCards=[
  {action:"amylase",icon:"A",label:"アミラーゼ",shuffle:true},
  {action:"pepsin",icon:"P",label:"ペプシン",shuffle:true},
  {action:"trypsin",icon:"T",label:"トリプシン",shuffle:true},
  {action:"lipase",icon:"L",label:"リパーゼ",shuffle:true},
  {action:"bile",icon:"🟢",label:"胆汁",shuffle:true}
];
const fixedCards=[
  {action:"blood",icon:"🩸",label:"毛細血管",shuffle:false},
  {action:"lymph",icon:"🟡",label:"リンパ管",shuffle:false},
  {action:"re",icon:"↻",label:"再合成",shuffle:false}
];
let currentEnzymeCards=[...enzymeCards];

function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(f=600,d=0.07,vol=.045,delay=0,type="sine"){
  try{
    let a=getAudio();
    let o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.frequency.value=f;o.type=type;
    let t=a.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d);
  }catch(e){}
}
function tapSelect(){tone(760,.055,.04,0,"triangle")}
function tapStart(){tone(520,.06,.04,0,"triangle");tone(760,.06,.04,.06,"triangle");tone(1040,.07,.04,.12,"triangle")}
function beep(f=600,d=0.07){tone(f,d,.045,0,"sine")}

function toggleShuffle(){
  shuffleEnabled=!shuffleEnabled;
  updateShuffleToggle();
}
function updateShuffleToggle(){
  const text=`酵素シャッフル：${shuffleEnabled?"ON":"OFF"}`;
  const t=document.getElementById("shuffleToggle");
  t.textContent=text;
  t.classList.toggle("on",shuffleEnabled);
  document.getElementById("shuffleStatusText").textContent=text;
}
function renderActions(){
  const grid=document.getElementById("actionGrid");
  grid.innerHTML="";
  const cards=[...currentEnzymeCards,...fixedCards];
  cards.forEach(card=>{
    const div=document.createElement("div");
    div.className="action"+(selectedAction===card.action?" selected":"")+(card.shuffle?" shuffleTarget":"");
    div.dataset.action=card.action;
    div.innerHTML=`<span class="icon">${card.icon}</span>${card.label}`;
    div.onclick=()=>{
      tapSelect();
      selectedAction=card.action;
      msg(selectedOrgan?"カードを使う器官をタップ":"先に食べ物のある器官を選択");
      render();
    };
    grid.appendChild(div);
  });
}

function showDifficulty(){
  document.getElementById("modeCard").classList.add("hidden");
  document.getElementById("difficultyCard").classList.remove("hidden");
  updateShuffleToggle();
}
function backTitle(){
  document.getElementById("difficultyCard").classList.add("hidden");
  document.getElementById("modeCard").classList.remove("hidden");
}

function startGame(m,d){
  mode=m; difficulty=d||"free";
  timer=60;elapsed=0;score=0;life=3;combo=0;maxCombo=0;queue=[];
  organs={mouth:null,stomach:null,duo:null,small:null};
  selectedQueue=null;selectedOrgan=null;selectedAction=null;
  currentEnzymeCards=[...enzymeCards];
  clearShuffleTimers();

  if(mode==="60"){
    spawn=diff[difficulty].spawn;
    document.getElementById("time").textContent=60;
    document.getElementById("modeInfo").textContent=diff[difficulty].label+" / MAX 6"+(shuffleEnabled?" / SHUFFLE":"");
  }else{
    spawn=5500;
    document.getElementById("time").textContent="0:00";
    document.getElementById("modeInfo").textContent="FREE / SPEED UP"+(shuffleEnabled?" / SHUFFLE":"");
  }

  document.getElementById("title").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  for(let i=0;i<2;i++) spawnFood(false);
  render();
  scheduleSpawn();
  scheduleShuffles();

  timeLoop=setInterval(()=>{
    if(mode==="60"){
      timer--;
      document.getElementById("time").textContent=timer;
      if(timer<=0) endGame("timeup");
    }else{
      elapsed++;
      document.getElementById("time").textContent=formatTime(elapsed);
    }
  },1000);

  if(mode==="endless"){
    levelLoop=setInterval(()=>{
      spawn=Math.max(800,spawn-200);
      clearTimeout(spawnTimer);
      scheduleSpawn();
      msg("スピードアップ");
      tone(880,.05,.035);tone(1120,.07,.035,.055);
    },12000);
  }
}

function scheduleShuffles(){
  if(!shuffleEnabled)return;
  if(mode==="60"){
    diff[difficulty].shuffleAt.forEach(sec=>scheduleShuffleEvent(sec));
  }else{
    [45,90,135,180].forEach(sec=>scheduleShuffleEvent(sec));
  }
}
function scheduleShuffleEvent(sec){
  const warnMs=Math.max(0,(sec-3)*1000);
  const goMs=sec*1000;
  shuffleTimers.push(setTimeout(()=>warnShuffle(),warnMs));
  shuffleTimers.push(setTimeout(()=>doShuffle(),goMs));
}
function clearShuffleTimers(){
  shuffleTimers.forEach(id=>clearTimeout(id));
  shuffleTimers=[];
}
function warnShuffle(){
  eventPop("⚠️ ENZYME SHUFFLE");
  msg("酵素配置変更まで 3");
  flash("warn");
  tone(520,.08,.055,0,"square");
  tone(520,.08,.055,.45,"square");
  tone(520,.08,.055,.9,"square");
}
function doShuffle(){
  currentEnzymeCards=shuffleArray(currentEnzymeCards);
  selectedAction=null;
  render();
  document.querySelectorAll(".shuffleTarget").forEach(el=>{
    el.classList.add("shuffling");
    setTimeout(()=>el.classList.remove("shuffling"),420);
  });
  eventPop("ENZYME SHUFFLE");
  msg("酵素カードがシャッフルされた");
  tone(540,.07,.04,0,"triangle");
  tone(720,.07,.04,.07,"triangle");
  tone(960,.08,.04,.14,"triangle");
  tone(1280,.09,.035,.21,"triangle");
}
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  const same=a.every((card,idx)=>card.action===arr[idx].action);
  if(same && a.length>1)[a[0],a[1]]=[a[1],a[0]];
  return a;
}
function eventPop(t){
  const pop=document.getElementById("eventPop");
  pop.textContent=t;
  pop.classList.remove("event-show");
  void pop.offsetWidth;
  pop.classList.add("event-show");
}

function scheduleSpawn(){
  clearTimeout(spawnTimer);
  spawnTimer=setTimeout(()=>{
    spawnFood(true);
    scheduleSpawn();
  },spawn);
}
function spawnFood(check){
  if(queue.length>=6){
    if(check) endGame("full");
    return;
  }
  let k=["rice","meat","fat"][Math.floor(Math.random()*3)];
  queue.push({id:Date.now()+Math.random(),kind:k,step:0});
  render();
}
function render(){
  document.getElementById("life").textContent=life;
  document.getElementById("score").textContent=score;
  document.getElementById("combo").textContent=combo;
  let q=document.getElementById("queue");
  q.innerHTML="";
  queue.forEach((f,i)=>{
    let d=document.createElement("div");
    d.className="queue-slot"+(selectedQueue===i?" selected":"");
    d.textContent=foods[f.kind].icon;
    d.onclick=()=>selectQueue(i);
    q.appendChild(d);
  });
  for(let i=queue.length;i<6;i++){
    let d=document.createElement("div");
    d.className="queue-slot empty";
    q.appendChild(d);
  }
  document.querySelectorAll(".organ").forEach(o=>{
    let key=o.dataset.organ;
    o.querySelector(".food").textContent=organs[key]?foods[organs[key].kind].icon:"";
    o.classList.toggle("selected",selectedOrgan===key);
  });
  renderActions();
}
function selectQueue(i){
  tapSelect();
  selectedQueue=i;selectedOrgan=null;selectedAction=null;
  msg(`${foods[queue[i].kind].name}を選択中`);
  render();
}
function organClick(org){
  if(selectedQueue!==null){
    if(organs[org]){miss("その器官は使用中");return;}
    let food=queue.splice(selectedQueue,1)[0];
    organs[org]=food;
    selectedQueue=null;selectedOrgan=org;
    msg(`${foods[food.kind].name}を${organName(org)}へ移動`);
    beep(520);render();return;
  }
  if(selectedOrgan && !selectedAction){
    if(organs[org] && org!==selectedOrgan){miss("移動先が使用中");return;}
    if(org!==selectedOrgan){
      organs[org]=organs[selectedOrgan];
      organs[selectedOrgan]=null;
      selectedOrgan=org;
      msg(`${organName(org)}へ移動`);
      beep(520);render();return;
    }
  }
  if(selectedOrgan && selectedAction){judge(org);return;}
  if(organs[org]){
    tapSelect();
    selectedOrgan=org;selectedQueue=null;selectedAction=null;
    msg(`${foods[organs[org].kind].name}を選択中`);
    render();
  }
}
document.querySelectorAll(".organ").forEach(b=>b.onclick=()=>organClick(b.dataset.organ));
function judge(org){
  let food=organs[selectedOrgan];
  if(!food)return;
  let type=foods[food.kind].type,a=selectedAction;
  let ok=false,finish=false;

  if(type==="carb"){
    if(food.step===0 && a==="amylase" && org==="mouth" && selectedOrgan==="mouth"){ok=true;food.step=1;}
    else if(food.step===1 && a==="amylase" && org==="duo" && selectedOrgan==="duo"){ok=true;food.step=2;}
    else if(food.step===2 && a==="blood" && org==="small" && selectedOrgan==="small"){ok=true;finish=true;}
  }
  if(type==="protein"){
    if(food.step===0 && a==="pepsin" && org==="stomach" && selectedOrgan==="stomach"){ok=true;food.step=1;}
    else if(food.step===1 && a==="trypsin" && org==="duo" && selectedOrgan==="duo"){ok=true;food.step=2;}
    else if(food.step===2 && a==="blood" && org==="small" && selectedOrgan==="small"){ok=true;finish=true;}
  }
  if(type==="fat"){
    if(food.step===0 && a==="bile" && org==="duo" && selectedOrgan==="duo"){ok=true;food.step=1;}
    else if(food.step===1 && a==="lipase" && org==="duo" && selectedOrgan==="duo"){ok=true;food.step=2;}
    else if(food.step===2 && a==="re" && org==="small" && selectedOrgan==="small"){ok=true;food.step=3;}
    else if(food.step===3 && a==="lymph" && org==="small" && selectedOrgan==="small"){ok=true;finish=true;}
  }

  if(ok && finish){
    addCombo();
    let point=comboPoint();
    score += point;
    organs[selectedOrgan]=null;
    selectedOrgan=null;selectedAction=null;
    absorb(`吸収成功 +${point}`);
  }else if(ok){
    addCombo();
    selectedAction=null;
    good(`正解 COMBO ×${combo}`);
  }else{
    selectedAction=null;
    miss("ミス");
  }
  render();
}
function addCombo(){
  combo++;
  if(combo>maxCombo) maxCombo=combo;
  showCombo(combo);
}
function comboPoint(){
  return Math.min(5, Math.max(1, combo));
}
function showCombo(n){
  let pop=document.getElementById("comboPop");
  pop.textContent=n>=3 ? `COMBO ×${n}` : `×${n}`;
  pop.classList.remove("combo-show");
  void pop.offsetWidth;
  pop.classList.add("combo-show");
  if(n>0 && n%10===0){tone(880,.05,.035);tone(1320,.09,.035,.06)}
}
function good(t){msg(t);flash("good");beep(850)}
function absorb(t){msg(`${t} / COMBO ×${combo}`);flash("absorb");tone(980,.06,.04);tone(1320,.09,.035,.06)}
function miss(t){
  combo=0;
  life--;
  msg(`${t}　LIFE -1 / COMBO RESET`);
  flash("bad");beep(180,.11);
  if(life<=0) endGame("life");
  render();
}
function flash(kind){
  document.body.classList.remove("flash-good","flash-bad","flash-absorb","flash-warn");
  void document.body.offsetWidth;
  document.body.classList.add(kind==="good"?"flash-good":kind==="absorb"?"flash-absorb":kind==="warn"?"flash-warn":"flash-bad");
  if(kind==="bad"){
    document.getElementById("game").classList.add("bad-shake");
    setTimeout(()=>document.getElementById("game").classList.remove("bad-shake"),190);
  }
}
function msg(t){document.getElementById("msg").textContent=t}
function organName(o){return {mouth:"口",stomach:"胃",duo:"十二指腸",small:"小腸"}[o]}
function formatTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function endGame(reason){
  clearTimeout(spawnTimer);clearInterval(timeLoop);clearInterval(levelLoop);clearShuffleTimers();
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let rank=score>=80?"S":score>=45?"A":score>=20?"B":"C";
  let suffix=shuffleEnabled?"_shuffle":"_fixed";
  let key=mode==="60" ? "digestiveFinal11Rank60_"+difficulty+suffix : "digestiveFinal11RankFree"+suffix;
  let list=JSON.parse(localStorage.getItem(key)||"[]");
  let record=mode==="60" ? {score,maxCombo} : {score,time:elapsed,maxCombo};
  list.push(record);
  list.sort((a,b)=> mode==="60" ? b.score-a.score : (b.score-a.score || b.time-a.time));
  list=list.slice(0,5);
  localStorage.setItem(key,JSON.stringify(list));

  let reasonText={timeup:"60秒終了",full:"食べ物ライン満杯",life:"ライフ切れ"}[reason]||"終了";
  let title=mode==="60" ? `60秒 ${diff[difficulty].label}` : "フリーモード";
  document.getElementById("resultText").innerHTML =
    `<div class="subtitle">${title} / SHUFFLE ${shuffleEnabled?"ON":"OFF"}</div><h1>${score}</h1><p>${reasonText}</p>`+
    (mode==="endless"?`<p>Survival Time ${formatTime(elapsed)}</p>`:"")+
    `<p>MAX COMBO ×${maxCombo}</p><h2>RANK ${rank}</h2>`;

  document.getElementById("rankingTitle").textContent = mode==="60" ? `RANKING / ${diff[difficulty].label} / ${shuffleEnabled?"SHUFFLE":"FIXED"}` : `RANKING / FREE / ${shuffleEnabled?"SHUFFLE":"FIXED"}`;
  document.getElementById("ranking").innerHTML=list.map((r,i)=>{
    return mode==="60" ? `${i+1}. ${r.score}　×${r.maxCombo}` : `${i+1}. ${r.score}　${formatTime(r.time)}　×${r.maxCombo}`;
  }).join("<br>");
}
updateShuffleToggle();
renderActions();
</script>
</body>
</html>
